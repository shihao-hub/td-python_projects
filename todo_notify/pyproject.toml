[project]
name = "todo_notify"
version = "0.1.0"
description = "扫描待办 Markdown 复选框并推送飞书提醒的 CLI 工具"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
todonotify = "todo_notify.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_notify"]

[dependency-groups]
dev = ["pytest>=8"]
