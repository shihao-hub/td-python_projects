[project]
name = "demo-api"
version = "0.1.0"
description = "FastAPI demo backend: uv + structlog + SQLAlchemy + PostgreSQL"
readme = "README.md"
authors = [
    { name = "shawn.zhang", email = "shawn.zhang@tec-do.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
