[project]
name = "tech-learning-room"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "aiokafka>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要真实 PG/Redis/Kafka 的集成测试（docker compose up -d 先起服务）",
]
