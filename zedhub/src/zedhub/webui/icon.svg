<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#2e2e38" stroke-width="8" />

  <!-- Accent glow line -->
  <g filter="url(#glow)">
    <!-- Circuit lines connecting as 'Z' -->
    <path d="M140 160 L372 160 L140 352 L372 352" 
          fill="none" 
          stroke="url(#primary)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Hub Nodes -->
    <circle cx="140" cy="160" r="26" fill="#6366f1" />
    <circle cx="372" cy="160" r="26" fill="#3b82f6" />
    <circle cx="140" cy="352" r="26" fill="#3b82f6" />
    <circle cx="372" cy="352" r="26" fill="#06b6d4" />

    <!-- Center node -->
    <circle cx="256" cy="256" r="18" fill="#ffffff" />
  </g>
</svg>
