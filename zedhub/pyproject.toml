[project]
name = "zedhub"
description = "Zed + OpenCode agent session hub: daemon CLI with HTTP/MCP/RPC/WS fronts"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "mcp==2.2.0",
    "websockets>=15,<16",
    "starlette>=0.40,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
zedhub = "zedhub.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# 版本由 git tag 推导（tag 形如 zedhub-v0.1.0，只识别本项目的 tag）：
# - HEAD 恰在 tag 上 → 干净发布号（生产构建判定依据）
# - tag 之后有新 commit → X.Y.devN+g<hash>（开发构建）
# - 无匹配 tag → fallback 0.0.0.dev0
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { tag_regex = "^zedhub-v(?P<version>\\d+[^/]*)$" }

[tool.hatch.build.targets.wheel]
packages = ["src/zedhub"]

[dependency-groups]
dev = ["pytest>=8"]
