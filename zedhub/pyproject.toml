[project]
name = "zedhub"
version = "0.1.0"
description = "Read-only CLI to query and visualize Zed editor agent session data"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "mcp>=2.1",
]

[project.scripts]
zedhub = "zedhub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zedhub"]

[dependency-groups]
dev = ["pytest>=8"]
