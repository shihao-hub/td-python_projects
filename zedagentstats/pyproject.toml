[project]
name = "zedagentstats"
version = "0.2.0"
description = "Token usage and cost statistics tool for Zed ACP agent sessions (pi / antigravity / opencode)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
zedagentstats = "zedagentstats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
