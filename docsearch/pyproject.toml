[project]
name = "docsearch"
version = "0.1.0"
description = "Lightweight local semantic document search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "lancedb>=0.6.0",
    "fastembed>=0.2.0",
    "watchdog>=4.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
docsearch = "docsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsearch"]
