<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景圆角底板 -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#2e2e38" stroke-width="3"/>

  <!-- 文档晶格卡片 -->
  <g filter="url(#shadow)">
    <rect x="110" y="100" width="220" height="280" rx="20" fill="#262630" stroke="#3f3f4e" stroke-width="3"/>
    <!-- 代码/文本纹理线条 -->
    <rect x="145" y="150" width="120" height="12" rx="6" fill="#4b5563"/>
    <rect x="145" y="180" width="150" height="10" rx="5" fill="#374151"/>
    <rect x="145" y="206" width="130" height="10" rx="5" fill="#374151"/>
    <rect x="145" y="232" width="100" height="10" rx="5" fill="#374151"/>
    <rect x="145" y="258" width="140" height="10" rx="5" fill="#374151"/>
  </g>

  <!-- 语义放大镜聚焦层 -->
  <g filter="url(#shadow)">
    <!-- 镜片外环发光 -->
    <circle cx="310" cy="300" r="95" fill="url(#glowGrad)"/>
    <circle cx="310" cy="300" r="90" fill="#181820" fill-opacity="0.85" stroke="url(#accentGrad)" stroke-width="12"/>
    
    <!-- 闪电/火花核心 (Local AI 算力象征) -->
    <path d="M 315 245 L 285 295 L 310 295 L 295 345 L 340 285 L 315 285 Z" fill="#60a5fa"/>

    <!-- 放大镜把手 -->
    <path d="M 378 368 L 440 430" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
