[project]
name = "douyinnotify"
version = "0.1.0"
description = "监控抖音博主更新并推送飞书提醒的 CLI 工具"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "websocket-client>=1.8",
    "mcp>=1.2,<2",
]

[project.scripts]
douyinnotify = "douyinnotify.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyinnotify"]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1"]
