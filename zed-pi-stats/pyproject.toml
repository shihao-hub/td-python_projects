[project]
name = "zed-pi-stats"
version = "0.1.0"
description = "Token usage and cost statistics tool for Zed pi-acp agent sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
zed-pi-stats = "zed_pi_stats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
