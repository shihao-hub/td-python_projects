[project]
name = "zed-opencode-sessions"
version = "0.1.0"
description = "MCP server to query Zed + OpenCode session data"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "mcp>=2.1",
    "typer>=0.12",
]

[project.scripts]
zoc = "zoc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoc"]

[dependency-groups]
dev = ["pytest>=8"]
